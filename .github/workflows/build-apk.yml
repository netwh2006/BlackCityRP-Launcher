name: Build BlackCityRP Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q BlackCityRP-Launcher-Source.zip -d buildsrc

      - name: Force JVM compatibility
        run: |
          cat > /tmp/force-jvm.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "1.8"
                  targetCompatibility = "1.8"
              }

              tasks.matching {
                  it.class.name.contains("KotlinCompile")
              }.configureEach {
                  kotlinOptions.jvmTarget = "1.8"
              }
          }
          EOF

      - name: Detect Gradle project
        run: |
          SETTINGS=$(find buildsrc -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle -I /tmp/force-jvm.gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find buildsrc -type f -name "*.apk" -print

          APK=$(find buildsrc -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/BlackCityRP-Launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackCityRP-Launcher-APK
          path: apk-output/BlackCityRP-Launcher.apk
          if-no-files-found: error
          retention-days: 30
