name: Build BlackCityRP Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q BlackCityRP-Launcher-Source.zip -d buildsrc

      - name: Force JVM target compatibility
        run: |
          cat > /tmp/force-jvm.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "1.8"
                  targetCompatibility = "1.8"
              }

              tasks.withType(KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "1.8"
                  }
              }
          }
          EOF

      - name: Detect project directory
        run: |
          SETTINGS=$(find buildsrc -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
